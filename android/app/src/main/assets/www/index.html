<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Location journal</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="map" role="region" aria-label="Map of the route and stays"></div>
  <p id="map-error" class="map-error" hidden>Map tiles did not load. Check the network, then move the map to try again.</p>

  <header class="float-top">
    <div>
      <p class="eyebrow">Journal</p>
      <p id="status" data-kind="idle">Opening…</p>
    </div>
    <p id="live-chip" class="chip" data-kind="idle">Idle</p>
  </header>

  <section class="sheet" aria-label="Trip details">
    <div class="sheet-head">
      <section class="stats" aria-label="Summary">
        <div><strong id="distance-count">0 m</strong><span>distance</span></div>
        <div><strong id="speed-count">—</strong><span>speed</span></div>
        <div><strong id="fix-count">0</strong><span>points</span></div>
        <div><strong id="stay-count">0</strong><span>stays</span></div>
        <div><strong id="photo-count">0</strong><span>photos</span></div>
      </section>
      <div class="primary">
        <button id="toggle-tracking" type="button" aria-pressed="false">Start tracking</button>
        <button id="open-camera" class="ghost" type="button">Photo</button>
        <button id="record-now" class="ghost" type="button">Fix</button>
        <button id="more-toggle" class="ghost" type="button" aria-expanded="false">More</button>
      </div>
      <p id="next-hour"></p>
      <div id="more-panel" class="more" hidden>
        <button id="load-mock" type="button">Load sample day</button>
        <button id="clear-mock" class="ghost" type="button">Remove sample</button>
        <button id="follow-map" class="ghost" type="button" aria-pressed="false">Follow</button>
        <button id="replay" class="ghost" type="button">Replay</button>
        <button id="auto-photo" class="ghost" type="button" aria-pressed="false">Auto photo 20s</button>
        <label class="file-btn ghost">Gallery<input id="photo-input" type="file" accept="image/*" multiple /></label>
        <label class="file-btn ghost">Folder<input id="folder-input" type="file" accept="image/*" webkitdirectory directory multiple /></label>
        <button id="export-log" class="ghost" type="button">Export</button>
        <button id="clear-photos" class="ghost" type="button">Remove photos</button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" class="tab is-on" data-tab="route">Route</button>
      <button type="button" class="tab" data-tab="stays">Stays</button>
      <button type="button" class="tab" data-tab="photos">Photos</button>
      <button type="button" class="tab" data-tab="log">Hourly</button>
    </div>
    <div class="sheet-body">
      <div id="panel-route" class="tab-panel"></div>
      <div id="panel-stays" class="tab-panel" hidden>
        <p class="hint" id="stay-hint">A stay is two or more fixes inside about 200 meters across at least 30 minutes.</p>
        <div id="stays"></div>
      </div>
      <div id="panel-photos" class="tab-panel" hidden>
        <div id="loose"></div>
      </div>
      <div id="panel-log" class="tab-panel" hidden>
        <ol id="hourly-log"></ol>
      </div>
    </div>
  </section>

  <div id="camera-sheet" class="camera-sheet" hidden>
    <video id="camera-preview" playsinline autoplay muted></video>
    <div class="camera-actions">
      <button id="shutter" type="button">Capture</button>
      <button id="close-camera" class="ghost" type="button">Close</button>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
